# TeslaTrack settings
# Copy this file to config.ini and edit that copy:  cp config.example.ini config.ini
# After editing, restart with:  sudo systemctl restart teslatrack

[tesla]
# Your car's VIN
vin =
# File holding your Teslemetry access token, readable only by you (chmod 600).
# SolarCharge users can share the same file.
token_file = ~/.solarcharge_token
api_base = https://api.teslemetry.com

[home]
# Where the car lives. Leave blank to learn it automatically: from where the car is plugged into the
# Wall Charger (when SolarCharge runs on this Pi), or from where it spends three nights.
latitude =
longitude =
radius_m = 250

[trips]
# A trip ends once the car has been in Park this long, so traffic lights and drive throughs don't split it
park_minutes = 3
# Ignore moves shorter than this, like shuffling the car in the driveway
min_km = 0.3
# Look up suburb names for where trips start and end (OpenStreetMap Nominatim, free, one lookup per trip end)
place_names = true

[tariff]
# Rough prices for charging away from home, cents per kWh
away_dc_c_per_kwh = 60
away_ac_c_per_kwh = 40

[solarcharge]
# SolarCharge on this Pi: TeslaTrack learns home from it and shows its rain forecast. Blank url to turn off.
url = http://localhost:8080

[storage]
data_dir = ~/teslatrack/data
# Save the car's history to the SD card this often
save_minutes = 30
events_max_kb = 512
# The first time TeslaTrack starts, it brings across car history from SolarCharge
import_from = ~/solarcharge/data/state.json

[web]
bind = 0.0.0.0
port = 8084
